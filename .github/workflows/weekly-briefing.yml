name: Weekly Healthcare Sector Briefing

# NOTE: this deliberately does NOT use anthropics/claude-code-action.
# That action has an open startup crash (schema validation, exits in ~110ms
# with modelUsage:{} and no API call - see anthropics/claude-code-action#914
# and #892) and it also force-disables WebSearch/WebFetch regardless of
# --allowedTools (#690). Calling the Claude Code CLI directly avoids both.

on:
  schedule:
    # 12:00 UTC every Monday (8am ET / 5am PT), an hour after the daily
    # tracker run so they don't race on committing index.html.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installed
        run: |
          claude --version
          echo "Claude Code is on PATH."

      # Claude researches the week and writes briefing_draft.json.
      # Authenticates with the Pro subscription via CLAUDE_CODE_OAUTH_TOKEN,
      # which is the documented credential for CI (no API key, no API billing).
      - name: Research and draft the briefing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          # Quoted delimiter: nothing inside is expanded by the shell, so the
          # JSON braces and quotes in the prompt survive verbatim.
          cat > "$RUNNER_TEMP/prompt.txt" << 'BRIEFING_PROMPT_EOF'
          You are writing this week's "Healthcare Sector Briefing" for a
          credit-risk tracker used by a bank's healthcare lending desk. The reader
          underwrites loans across post-acute, senior care, home-based care,
          diagnostics and behavioral health operators.

          THE MOST IMPORTANT THING YOU DO is separate what has ACTUALLY TAKEN
          EFFECT from what is merely proposed, enacted-but-not-yet-operative, or
          political messaging. A proposed rate increase is not an earnings
          benefit. A federal payment deferral is not a permanent rate cut. A
          draft LCD is not a coverage decision. Headlines routinely blur these;
          you must not. If something is being reported as a "cut" but is
          technically a deferral or a proposal, say so plainly and explain the
          difference.

          COVER ALL NINE SECTORS BELOW. Use WebSearch and WebFetch to find
          significant, verifiable developments from the last 7 days in each:

          1. SKILLED NURSING - SNF PPS, staffing rules, survey and certification,
             Five-Star, state Medicaid SNF rates, provider taxes.
          2. HOME HEALTH - HH PPS, PDGM behavioral adjustments, face-to-face and
             certification rules, home health value-based purchasing.
          3. HOSPICE - hospice wage index, the aggregate cap, program integrity,
             the special focus program, hospice enrollment moratoria.
          4. HOME CARE / PERSONAL CARE / HCBS - 1915(c) waivers, the access rule,
             EVV, direct care workforce, provider enrollment and moratoria.
          5. SENIOR HOUSING / ASSISTED LIVING / MEMORY CARE - state licensure and
             staffing, Medicaid assisted living waivers, occupancy and rate data.
          6. DME - competitive bidding, the DMEPOS fee schedule, supplier
             standards, prior authorization lists, oxygen and respiratory policy.
          7. LABS AND MOLECULAR DIAGNOSTICS COVERAGE - treat this as ONE category
             and cover it every week. Specifically: MolDx program decisions,
             Local Coverage Determinations (LCDs) both proposed and final,
             technical assessments by Medicare Administrative Contractors (MACs),
             Novitas and Palmetto GBA actions, coverage of molecular and PCR
             testing including UTI and urinary tract panels, and the Clinical Lab
             Fee Schedule. Say clearly whether an LCD is draft, finalized, or
             effective, and which MAC jurisdictions and states it binds.
          8. BEHAVIORAL HEALTH AND SUD TREATMENT - parity enforcement,
             reimbursement, state licensure, payer disputes.
          9. MEDICAID POLICY AND FINANCING - cutting across all of the above:
             provider taxes, state budgets, work requirements, redeterminations,
             federal match, program integrity.

          Prefer primary sources: cms.gov (including the Medicare Coverage
          Database for LCDs), medicaid.gov, federalregister.gov, oig.hhs.gov,
          macpac.gov, palmettogba.com, novitas-solutions.com. Cite the primary
          source wherever one exists. Acceptable secondary sources: kff.org,
          allianceforcareathome.org, skillednursingnews.com,
          homehealthcarenews.com, hospicenews.com, mcknightsseniorliving.com,
          mcknightshomecare.com, hmenews.com, behavioralhealthbusiness.com.

          Then use the Write tool to create a file named exactly
          briefing_draft.json in the current directory, containing ONLY a single
          JSON object in this shape:

          {
            "overview": "One paragraph naming the week's dominant theme across
              the sectors, in the first person as the analyst. Where the week's
              action concentrated in one or two sectors, say so. CRITICALLY: also
              state plainly what did NOT happen this week if a reader might
              otherwise assume it did, for example 'There was no new broad federal
              reimbursement cut to Medicare home health this week.' Negative space
              is as informative as news.",
            "items": [
              {
                "headline": "Begin with the sector, then a colon, then a short
                  specific factual headline. For example 'Skilled nursing: CMS
                  finalizes FY2027 SNF payment update' or 'Labs / MolDx: Novitas
                  finalizes LCD for molecular UTI panels'. This is how the reader
                  finds their sector at a glance.",
                "status": "One sentence stating exactly where this stands, e.g.
                  'Implemented August 1, with CMS approval.' or 'Proposed;
                  comments due August 31.'",
                "statusTier": "implemented | proposed | pending | rhetoric",
                "body": "Two to four substantive paragraphs separated by blank
                  lines. Give the specifics a credit analyst needs: dollar
                  figures, effective dates, which states, which waiver programs,
                  which provider types, comment deadlines. Explain why it matters
                  beyond the immediate facts.",
                "creditImplication": "One to three sentences, first person, on
                  what this means for underwriting credits in the affected sector.
                  Be specific about whether it changes rates, timing, enrollment,
                  coverage, census, M&A, working capital or compliance cost.",
                "sources": [{"label": "CMS", "url": "https://..."}]
              }
            ],
            "table": [
              {
                "development": "Short label matching an item above",
                "status": "Implemented | Proposed | Enacted / implementation
                  underway | Partly rhetoric | Not newly implemented",
                "read": "Your one-line credit read, e.g. 'Do not underwrite yet'
                  or 'Real liquidity/timing risk'"
              }
            ],
            "focus": "A closing paragraph naming the concrete diligence items that
              matter most right now across the book, tied to this week's
              developments. Draw from: state-by-state revenue concentration,
              payor mix and Medicaid dependence, Medicaid DSO and denied-claim
              trends, EVV compliance, provider revalidation and enrollment
              status, change-of-ownership risk, survey and audit history,
              occupancy and census trends, competitive bidding exposure for DME,
              and LCD or MAC coverage concentration for lab and diagnostics
              credits. Name only what this week's news actually makes relevant."
          }

          Rules:
          - 5 to 9 items, prioritised by how much they move credit risk, not by
            sector order. A quiet sector gets no item; a sector with two genuinely
            significant developments can have two. Every item must rest on a real,
            dated source you actually found. Do not cite from memory.
          - statusTier must be exactly one of: implemented, proposed, pending,
            rhetoric.
          - THE TABLE IS THE COVERAGE MAP. It must contain a row for EVERY ONE of
            the nine sectors listed above, including sectors with no news. For a
            quiet sector use status "Not newly implemented" and a read such as
            "No federal action this week". This is deliberate: the reader needs to
            see that a sector was checked and was quiet, rather than wondering
            whether it was missed. Add extra rows beyond the nine for anything a
            reader might wrongly assume changed.
          - Measured analyst register; first person where you give a judgement.
            No political editorialising.
          - Do not invent, estimate or round figures. If a source does not state
            a number, do not supply one.
          - If the week was genuinely quiet, say so in the overview rather than
            padding with minor items.
          - Write ONLY briefing_draft.json. Do not create or modify any other
            file.
          BRIEFING_PROMPT_EOF

          echo "Prompt prepared ($(wc -l < "$RUNNER_TEMP/prompt.txt") lines). Running Claude Code..."

          claude -p "$(cat "$RUNNER_TEMP/prompt.txt")" \
            --model claude-sonnet-5 \
            --max-turns 40 \
            --allowedTools "WebSearch,WebFetch,Write,Read" \
            --output-format text \
            2>&1 | tee "$RUNNER_TEMP/claude-output.txt"

          echo ""
          echo "--- did Claude produce the draft? ---"
          if [ -f briefing_draft.json ]; then
            echo "briefing_draft.json created, $(wc -c < briefing_draft.json) bytes"
          else
            echo "ERROR: briefing_draft.json was not created."
            echo "Claude's output is above. Nothing will be published or emailed."
            exit 1
          fi

      # Deterministic half: validate the draft, merge it into the history.
      # Fails the run, before build or send, if the draft is malformed.
      - name: Validate and merge the draft
        run: python merge_briefing.py

      - name: Rebuild index.html
        run: python build_page.py

      - name: Send weekly briefing email
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM:       ${{ secrets.DIGEST_FROM }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_SITE_URL:   https://camden21.github.io/Healthcare-News/
        run: python send_weekly_briefing_email.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # briefing_draft.json is scratch and is deleted by merge_briefing.py;
          # it is deliberately not added here.
          for f in weekly_briefings.json index.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly Medicaid/Home Health/HCBS briefing - $(date -u '+%Y-%m-%d')"
          git push
