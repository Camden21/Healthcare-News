name: Weekly Medicaid/Home Health/HCBS Briefing

on:
  schedule:
    # 12:00 UTC every Monday (8am ET / 5am PT) — an hour after the daily
    # tracker run (11:00 UTC) so they don't race on committing index.html.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate weekly briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_briefing.py

      - name: Rebuild index.html
        run: python build_page.py

      - name: Send weekly briefing email
        env:
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM:       ${{ secrets.DIGEST_FROM }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          DIGEST_SITE_URL:   https://camden21.github.io/Healthcare-News/
        run: python send_weekly_briefing_email.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in weekly_briefings.json index.html; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Weekly Medicaid/Home Health/HCBS briefing — $(date -u '+%Y-%m-%d')"
          git push
