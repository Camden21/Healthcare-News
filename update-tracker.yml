name: Update Healthcare Tracker

on:
  schedule:
    # 11:00 UTC daily = 7am ET / 4am PT. Cron is always UTC.
    - cron: '0 11 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write           # required so the job can commit back to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch new events
        run: python fetch_events.py

      - name: Rebuild index.html
        run: python build_page.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet events.json index.html; then
            echo "No changes to commit."
            exit 0
          fi

          git add events.json index.html
          git commit -m "Auto-update tracker — $(date -u '+%Y-%m-%d')"
          git push
